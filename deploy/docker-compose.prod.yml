# production: รันจากโฟลเดอร์โปรเจกต์บน server
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# ทุก service คุยกันใน network ภายใน · เปิดออกภายนอกแค่ Caddy (80/443)
name: tmpp-prod

x-django: &django
  build:
    context: ..
    dockerfile: Dockerfile
  image: tmpp-web:latest
  restart: unless-stopped
  env_file: ../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    PRIVATE_MEDIA_ROOT: /app/private_media
    FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
  volumes:
    - media:/app/media
    - private_media:/app/private_media
    # ไฟล์ลับ (เช่น service account ของ Firebase) วางไว้ที่ ./secrets บน server (ไม่อยู่ใน git)
    - ../secrets:/app/secrets:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?ตั้ง POSTGRES_DB ใน .env}
      POSTGRES_USER: ${POSTGRES_USER:?ตั้ง POSTGRES_USER ใน .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # ไม่มี ports: ฐานข้อมูลเข้าจากภายนอกไม่ได้

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  web:
    <<: *django
    # รวบรวมไฟล์ static ใหม่ทุกครั้งที่เริ่ม (ได้ไฟล์ล่าสุดหลังอัปเดตโค้ด) แล้วเปิด gunicorn
    command: >
      sh -c "python manage.py collectstatic --noinput -v 0 &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    volumes:
      - media:/app/media
      - private_media:/app/private_media
      - static:/app/staticfiles
      - ../secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ -H 'Host: localhost' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *django
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *django
    # งานตามเวลา: ยกเลิกออเดอร์ที่ไม่จ่ายเกินเวลา ทุก 1 นาที
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # ยังไม่มีโดเมน = ":80" (เปิดด้วย IP) · มีโดเมนแล้ว = "tmth-th.com, www.tmth-th.com" (Caddy ออก HTTPS ให้เอง)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # IP ของ proxy ข้างหน้าที่เชื่อ header ได้ (เพิ่ม IP สาธารณะของ server ถ้าระบบเดิมส่งต่อผ่าน IP นั้น)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  redis:
  static:
  media:
  private_media:
  caddy_data:
  caddy_config:
