{# กระดิ่งแจ้งเตือน + จำนวนที่ยังไม่อ่าน #}
{% if user.is_authenticated %}
<a href="{% url 'notifications:list' %}" class="btn {{ bell_class|default:'btn-outline-ink' }} btn-sm position-relative" aria-label="แจ้งเตือน{% if unread_notifications %} {{ unread_notifications }} รายการที่ยังไม่อ่าน{% endif %}">
  <i class="bi bi-bell"></i>
  {% if unread_notifications %}<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background: var(--tm-accent); font-size: .6rem;">{{ unread_notifications }}</span>{% endif %}
</a>
{% endif %}
