{# ช่องกรอกแบบ Bootstrap: {% include "components/_field.html" with field=form.email %} #}
<div class="{{ wrapper_class|default:'mb-3' }}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="text-muted-tm fw-normal">(ไม่บังคับ)</span>{% endif %}</label>
  <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
         class="form-control{% if field.errors %} is-invalid{% endif %}"
         {% if field.field.widget.input_type != 'password' and field.value is not None and field.value != '' %}value="{{ field.value }}"{% endif %}
         {% if field.field.required %}required{% endif %}
         {% for name, value in field.field.widget.attrs.items %}{% if value is True %} {{ name }}{% elif value is not False %} {{ name }}="{{ value }}"{% endif %}{% endfor %}>
  {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text small-xs">{{ field.help_text }}</div>{% endif %}
</div>
