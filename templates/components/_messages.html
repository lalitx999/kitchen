{% if messages %}
<div class="container-xl pt-3" role="status">
  {% for message in messages %}
  <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'info' %}alert-info{% else %}alert-success{% endif %} d-flex align-items-start gap-2 mb-2">
    <i class="bi {% if message.tags == 'error' %}bi-x-circle{% elif message.tags == 'warning' %}bi-exclamation-triangle{% else %}bi-check-circle{% endif %} mt-1"></i>
    <div>{{ message }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
