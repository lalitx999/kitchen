{# ช่องรูปของร้าน: field = ฟิลด์ไฟล์, current = รูปปัจจุบัน, remove = ชื่อช่องลบ, shape = 'cover' | 'front' #}
<div class="{{ wrapper_class|default:'col-12' }}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }} <span class="text-muted-tm fw-normal">(ไม่บังคับ)</span></label>
  {% if current %}
    <div class="shop-image-preview shop-image-{{ shape }} mb-2">
      <img src="{{ current.url }}" alt="{{ field.label }}" loading="lazy">
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" name="{{ remove }}" id="id_{{ remove }}">
      <label class="form-check-label small" for="id_{{ remove }}">ลบรูปนี้</label>
    </div>
  {% endif %}
  <input type="file" name="{{ field.html_name }}" id="{{ field.id_for_label }}" accept="image/jpeg,image/png,image/webp"
         class="form-control{% if field.errors %} is-invalid{% endif %}">
  {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
  <div class="form-text small-xs">{{ field.help_text }}</div>
</div>
