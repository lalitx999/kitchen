{# สวิตช์เปิด/ปิดรับออเดอร์ (HTMX แทนที่ทั้งก้อน) #}
<div id="shop-switch" class="card-tm card-tm-body d-flex flex-wrap align-items-center justify-content-between gap-3">
  <div>
    <div class="small text-muted-tm fw-bold">หน้าร้านตอนนี้</div>
    {% if shop.accepting %}
      <div class="fs-5 fw-black text-action"><i class="bi bi-circle-fill me-2 small"></i>เปิดรับออเดอร์</div>
    {% else %}
      <div class="fs-5 fw-black text-muted-tm"><i class="bi bi-circle me-2 small"></i>ปิดรับออเดอร์</div>
      <div class="small text-muted-tm">{{ shop.reason }}</div>
    {% endif %}
  </div>
  <form hx-post="{% url 'console:shop_toggle_open' %}" hx-target="#shop-switch" hx-swap="outerHTML">
    <input type="hidden" name="is_open" value="{% if branch.is_open %}0{% else %}1{% endif %}">
    {% if branch.is_open %}
      <button class="btn btn-outline-ink btn-icon"><i class="bi bi-pause-circle"></i>ปิดรับออเดอร์</button>
    {% else %}
      <button class="btn btn-action btn-icon" {% if not branch.location %}disabled title="ตั้งพิกัดร้านก่อน"{% endif %}><i class="bi bi-play-circle"></i>เปิดรับออเดอร์</button>
    {% endif %}
  </form>
  {% if not branch.location %}<div class="w-100 small"><a href="{% url 'console:shop' %}">ตั้งพิกัดร้าน</a> ก่อนจึงจะเปิดรับออเดอร์ได้</div>{% endif %}
</div>
