{% load humanize %}
<tr id="item-{{ item.pk }}" class="{% if not item.is_available %}text-muted-tm{% endif %}">
  <td style="width: 56px;">
    {% if item.image %}<img src="{{ item.image.url }}" alt="" width="48" height="48" class="rounded-3 object-fit-cover">
    {% else %}<span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-light text-muted-tm" style="width:48px;height:48px;"><i class="bi bi-image"></i></span>{% endif %}
  </td>
  <td class="min-w-0">
    <a href="{% url 'console:menu_item_edit' item.pk %}" class="fw-bold text-reset text-decoration-none">{{ item.name }}</a>
    <div class="small-xs text-muted-tm">{% with n=item.options.all|length %}{% if n %}ตัวเลือก {{ n }} อย่าง{% else %}ไม่มีตัวเลือก{% endif %}{% endwith %}</div>
  </td>
  <td class="fw-bold font-mono-num text-nowrap">฿{{ item.price|floatformat:"-2"|intcomma }}</td>
  <td class="text-end text-nowrap">
    <form class="d-inline" hx-post="{% url 'console:menu_item_toggle' item.pk %}" hx-target="#item-{{ item.pk }}" hx-swap="outerHTML">
      <input type="hidden" name="available" value="{% if item.is_available %}0{% else %}1{% endif %}">
      {% if item.is_available %}
        <button class="btn btn-sm btn-outline-ink">หมด</button>
      {% else %}
        <button class="btn btn-sm btn-action">มีขาย</button>
      {% endif %}
    </form>
    <a href="{% url 'console:menu_item_edit' item.pk %}" class="btn btn-sm btn-outline-ink" aria-label="แก้ไข"><i class="bi bi-pencil"></i></a>
  </td>
</tr>
