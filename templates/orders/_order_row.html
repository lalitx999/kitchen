{% load humanize %}
<a href="{% url 'orders:detail' order.pk %}" class="card-tm card-tm-body d-flex align-items-center justify-content-between gap-3 text-decoration-none text-reset">
  <div class="min-w-0">
    <div class="d-flex align-items-center gap-2 mb-1">
      <span class="fw-black font-mono-num">{{ order.order_number }}</span>
      {% include "components/_status_badge.html" %}
    </div>
    <div class="small text-muted-tm text-truncate">
      {% for item in order.items.all %}{{ item.quantity }}x {{ item.name }}{% if not forloop.last %}, {% endif %}{% endfor %}
    </div>
    <div class="small-xs text-muted-tm">{{ order.created_at|date:"j M Y H:i" }} น.</div>
  </div>
  <div class="text-end">
    <div class="fw-black font-mono-num">฿{{ order.total|floatformat:"-2"|intcomma }}</div>
    <i class="bi bi-chevron-right text-muted-tm"></i>
  </div>
</a>
