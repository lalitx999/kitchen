<div id="kitchen-shop" class="card-tm card-tm-body py-2 d-flex flex-wrap align-items-center justify-content-between gap-2 h-100">
  <div class="d-flex align-items-center gap-2">
    {% if shop.accepting %}
      <span class="fw-black text-action"><i class="bi bi-circle-fill me-1 small"></i>หน้าร้านเปิดรับออเดอร์</span>
    {% else %}
      <span class="fw-black text-muted-tm"><i class="bi bi-circle me-1 small"></i>ปิดรับออเดอร์</span>
      <span class="small text-muted-tm">{{ shop.reason }}</span>
    {% endif %}
  </div>
  <form hx-post="{% url 'orders:kitchen_toggle_shop' %}" hx-target="#kitchen-shop" hx-swap="outerHTML">
    <input type="hidden" name="is_open" value="{% if branch.is_open %}0{% else %}1{% endif %}">
    {% if branch.is_open %}
      <button class="btn btn-outline-ink btn-sm btn-icon"><i class="bi bi-pause-circle"></i>ปิดชั่วคราว</button>
    {% else %}
      <button class="btn btn-action btn-sm btn-icon"><i class="bi bi-play-circle"></i>เปิดรับออเดอร์</button>
    {% endif %}
  </form>
</div>
